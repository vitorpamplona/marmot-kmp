[versions]
agp = "9.4.1"
android-compileSdk = "37"
android-minSdk = "26"
composeRuntimeAnnotation = "1.12.1"
# SHA, HMAC, HKDF, AES, ChaCha20, X25519, Ed25519 (vitorpamplona/crypto-kmp). Keep it at the newer of
# the versions Quartz and mls-kmp depend on, which is the one Gradle resolves anyway.
cryptoKmp = "2.1.0"
kotlin = "2.4.21"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.12.0"
mavenPublish = "0.37.0"
# RFC 9420 MLS engine (vitorpamplona/mls-kmp). Quartz no longer depends on it (2.3.0 dropped the
# Marmot engine), so it moves on its own. 1.3.0 is its next release; until that is on Maven
# Central, build against a checkout with -PmlsKmpDir=../mls-kmp (tools/ci/mls-kmp-args.sh does
# it in CI).
mlsKmp = "1.3.0"
# The Nostr protocol library (vitorpamplona/quartz). 2.3.0 is the first release without the Marmot engine;
# until it is on Maven Central, build against a checkout with -PquartzDir=../quartz.
quartzKmp = "2.3.0"
# The JNI bindings tests load must match the secp256k1-kmp version Quartz is built against.
secp256k1Kmp = "0.24.0"
spotless = "8.10.4"
# The SQLite driver quartz's event store runs on, for the in-process test relay.
sqlite = "2.7.1"

[libraries]
androidx-compose-runtime-annotation = { group = "androidx.compose.runtime", name = "runtime-annotation", version.ref = "composeRuntimeAnnotation" }
crypto = { module = "com.vitorpamplona.crypto:crypto", version.ref = "cryptoKmp" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
mls-kmp = { module = "com.vitorpamplona.mls:mls", version.ref = "mlsKmp" }
quartz = { module = "com.vitorpamplona.quartz:quartz", version.ref = "quartzKmp" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }
secp256k1-kmp-jni-jvm = { group = "fr.acinq.secp256k1", name = "secp256k1-kmp-jni-jvm", version.ref = "secp256k1Kmp" }

[plugins]
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
diffplugSpotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
