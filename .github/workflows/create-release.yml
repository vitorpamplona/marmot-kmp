name: Create Release Assets

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  # Finishes a release that only partly published: a signer that didn't answer for one module
  # leaves the others released, and a re-run of the tag's job fails on the first module already
  # on Nostr (releases are immutable). Run it from main with the tag and only the missing modules:
  # every job checks out the tag, so the files are built from the same commit as the rest.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to publish, e.g. v2.3.0'
        required: true
      modules:
        description: 'The modules to publish, separated by spaces (marmot)'
        required: true
        default: 'marmot'

# The tag every job checks out and publishes: the pushed tag, or the one a manual run names.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_MODULES: ${{ inputs.modules || 'marmot' }}

jobs:
  # A release must depend only on published artifacts: its POM names the Quartz and mls-kmp
  # versions it was built against, so those have to be released (both on Nostr + Blossom; a
  # GitHub tag marks the release) before this one can be.
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Tag and modules are valid
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$RELEASE_TAG is not a release tag (vX.Y.Z)."
            exit 1
          fi
          for module in $RELEASE_MODULES; do
            case "$module" in
              marmot) ;;
              *) echo "::error::Unknown module $module (marmot)."; exit 1 ;;
            esac
          done

      - name: Quartz release is published
        run: |
          args=$(tools/ci/quartz-args.sh 2>/dev/null || echo missing)
          if [ -n "$args" ]; then
            echo "::error::The Quartz version in gradle/libs.versions.toml is not released. Release Quartz first."
            exit 1
          fi

      - name: mls-kmp release is published
        run: |
          args=$(tools/ci/mls-kmp-args.sh 2>/dev/null || echo missing)
          if [ -n "$args" ]; then
            echo "::error::The mls-kmp version in gradle/libs.versions.toml is not released. Release mls-kmp first."
            exit 1
          fi

  # The Apple tests run on macOS before anything publishes.
  test-apple:
    needs: check-dependencies
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Test iOS
        run: |
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :marmot:iosSimulatorArm64Test \
            :marmot:compileTestKotlinIosArm64

  # Releases go to Nostr + Blossom only, through Magpie's publishToNostr (the plugin version is in
  # settings.gradle.kts, the relays in gradle.properties); Maven Central has no release since the
  # one that moved to Quartz 2.19.0, which isn't on Central either. The job runs the checks,
  # uploads every file to the release key's Blossom servers (kind 10063) and signs one release
  # event (kind 3071) per published module, sent to the key's own relays (its kind 10002 and
  # nostr.json). The key never reaches CI: MAGPIE_BUNKER is a NIP-46 bunker URI, so the signer
  # approves each release (the job waits for it), and vitorpamplona.com/.well-known/nostr.json
  # must name the key as "releases" or Magpie refuses to sign. A version already on Nostr fails
  # the job: releases are immutable, so when only some modules went out, finish the release with a
  # manual run of this workflow that names the tag and the missing modules. Apple klibs cross-compile on Linux; only Apple test binaries
  # need a Mac.
  nostr:
    needs: test-apple
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Linter (gradle)
        run: |
          ./gradlew spotlessCheck \
            :marmot:verifyKmpPurity \
            :marmot:compileCommonMainKotlinMetadata \
            :marmot:compileAppleMainKotlinMetadata

      - name: Check
        run: ./gradlew :marmot:jvmTest :marmot:linuxX64Test

      # Tag v1.2.3 publishes version 1.2.3.
      - name: Set version for tag
        run: |
          echo "ORG_GRADLE_PROJECT_VERSION_NAME=${RELEASE_TAG#v}" >> $GITHUB_ENV

      - name: Publish to Nostr
        run: |
          tasks=()
          for module in $RELEASE_MODULES; do tasks+=(":$module:publishToNostr"); done
          ./gradlew "${tasks[@]}" --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          MAGPIE_BUNKER: ${{ secrets.MAGPIE_BUNKER }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
