name: Test/Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Until the Quartz release this library pins is on Maven Central, tools/ci/quartz-args.sh clones
# vitorpamplona/quartz at QUARTZ_REF (a repository variable, default main) and the build uses
# that checkout. Once the release is out it prints nothing and the build uses the artifact.
# tools/ci/mls-kmp-args.sh does the same for mls-kmp, at MLS_KMP_REF.
env:
  QUARTZ_REF: ${{ vars.QUARTZ_REF || 'main' }}
  MLS_KMP_REF: ${{ vars.MLS_KMP_REF || 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Agent config (Claude Code and Codex read the same rules and skills)
        run: tools/agent-hooks/agent_config_check.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      # Writes the Gradle cache on push to main, reads it on PRs and other branches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Resolve Quartz
        run: echo "QUARTZ_ARGS=$(QUARTZ_CLONE_TO=$RUNNER_TEMP/quartz tools/ci/quartz-args.sh)" >> $GITHUB_ENV

      - name: Resolve mls-kmp
        run: echo "MLS_KMP_ARGS=$(MLS_KMP_CLONE_TO=$RUNNER_TEMP/mls-kmp tools/ci/mls-kmp-args.sh)" >> $GITHUB_ENV

      # The metadata compiles resolve commonMain against only the deps every target shares,
      # which is the Apple classpath, so a JVM-only API in shared code fails here, on Linux.
      - name: Linter (gradle)
        run: |
          ./gradlew $QUARTZ_ARGS $MLS_KMP_ARGS spotlessCheck \
            :marmot:verifyKmpPurity \
            :marmot:compileCommonMainKotlinMetadata \
            :marmot:compileAppleMainKotlinMetadata

      - name: Test JVM (gradle)
        run: ./gradlew $QUARTZ_ARGS $MLS_KMP_ARGS :marmot:jvmTest :marmot-quic:jvmTest

      - name: JVM Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: '*/build/test-results/jvmTest/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          fail_on_failure: true

      - name: Upload JVM Test Reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Marmot JVM Test Reports
          path: |
            marmot/build/reports/tests
            marmot-quic/build/reports/tests

      - name: Build (gradle)
        run: ./gradlew $QUARTZ_ARGS $MLS_KMP_ARGS :marmot:assemble :marmot-quic:assemble :marmot-bench:assemble

  # Runs the whole suite on Linux Native, which catches a commonMain or commonTest source
  # reaching for a JVM-only API on a target that has no Foundation to fall back on.
  test-linux-native:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Resolve Quartz
        run: echo "QUARTZ_ARGS=$(QUARTZ_CLONE_TO=$RUNNER_TEMP/quartz tools/ci/quartz-args.sh)" >> $GITHUB_ENV

      - name: Resolve mls-kmp
        run: echo "MLS_KMP_ARGS=$(MLS_KMP_CLONE_TO=$RUNNER_TEMP/mls-kmp tools/ci/mls-kmp-args.sh)" >> $GITHUB_ENV

      - name: Test Linux Native
        run: ./gradlew $QUARTZ_ARGS $MLS_KMP_ARGS :marmot:linuxX64Test

      - name: Linux Native Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: 'marmot/build/test-results/linuxX64Test/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          fail_on_failure: true

  # Apple test binaries link and run only on macOS.
  test-apple:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Resolve Quartz
        run: echo "QUARTZ_ARGS=$(QUARTZ_CLONE_TO=$RUNNER_TEMP/quartz tools/ci/quartz-args.sh)" >> $GITHUB_ENV

      - name: Resolve mls-kmp
        run: echo "MLS_KMP_ARGS=$(MLS_KMP_CLONE_TO=$RUNNER_TEMP/mls-kmp tools/ci/mls-kmp-args.sh)" >> $GITHUB_ENV

      - name: Test iOS
        run: |
          ./gradlew $QUARTZ_ARGS $MLS_KMP_ARGS \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :marmot:iosSimulatorArm64Test \
            :marmot:compileTestKotlinIosArm64

      - name: iOS Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: 'marmot/build/test-results/iosSimulatorArm64Test/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          fail_on_failure: true
