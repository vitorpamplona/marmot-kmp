#Gradle
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g
#Kotlin
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
# Apple targets build only on macOS; elsewhere skip them quietly instead of warning.
kotlin.native.ignoreDisabledTargets=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Maven Publishing
GROUP=com.vitorpamplona.marmot
POM_ARTIFACT_ID=marmot
VERSION_NAME=2.2.1

# Magpie (Nostr + Blossom publishing; Maven Central has the releases up to 2.2.1). Releases go to
# the release key's own relays, the write relays of its NIP-65 list (kind 10002) and the ones
# vitorpamplona.com/.well-known/nostr.json lists for it, which is where every client looks for them.
# Index relays are only where that relay list is looked up. For more copies, add write relays to the
# key's kind 10002.
magpie.indexRelays=wss://purplepag.es,wss://user.kindpag.es
